name: Pipeline de 3 Ambientes

on:
  push:
    branches:
      - develop
      - release
      - main

# Permisos necesarios para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: "Simulando despliegue a Desarrollo"
        run: echo "🚀 Código validado en Desarrollo."

  deploy-qa:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: "Simulando despliegue a Calidad (Staging)"
        run: echo "🧪 Código validado en Calidad. Listo para producción."

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: ${{ steps.deployment.outputs.page_url }} # Muestra la URL en GitHub
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Subir artefacto de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Sube todo el contenido de la raíz (nuestro index.html)
          
      - name: Desplegar a Producción (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
